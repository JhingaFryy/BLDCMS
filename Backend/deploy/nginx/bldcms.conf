# Module 45: BL-DCMS production Nginx config.
#
# Single public entry point (port 80) for both the Dashboard (static files) and the backend API
# (reverse-proxied to Gunicorn, which is bound to 127.0.0.1:8080 only - see
# deploy/systemd/bldcms-backend.service and gunicorn.conf.py). This is also why the Android app's
# API_BASE_URL must point at this Nginx origin, not directly at port 8080, once this is deployed
# - see Documentation/DEPLOYMENT.md.
#
# Install: sudo cp deploy/nginx/bldcms.conf /etc/nginx/sites-available/bldcms
#          sudo ln -s /etc/nginx/sites-available/bldcms /etc/nginx/sites-enabled/bldcms
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/bldcms/Dashboard/dist;  # CHANGE_ME: absolute path to this deployment's built Dashboard/dist
    index index.html;

    client_max_body_size 20M;

    # --- Gzip compression ---
    # Text-based assets only; images/fonts are already compressed formats and gzipping them
    # again wastes CPU for no size benefit. `gzip on` itself is already set globally in Ubuntu's
    # default /etc/nginx/nginx.conf (http block) - only declared again here if that global
    # default is ever absent; the gzip_* tuning directives below are server-scoped on purpose so
    # they don't collide with (or depend on) whatever else nginx.conf's http block does.
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # --- Security headers ---
    # Applied to this server-level context for any location that defines no add_header of its
    # own (e.g. the SPA fallback below). Locations that DO set their own Cache-Control
    # (immediately below, and the API proxy block) `include` deploy/nginx/security_headers.conf
    # explicitly instead of relying on inheritance - see that file for why.
    include /etc/nginx/bldcms/security_headers.conf;

    # --- Static asset caching ---
    # Vite fingerprints every built filename with a content hash (see Dashboard/dist/assets/) -
    # a changed file always gets a new URL, so far-future + immutable caching here is safe: the
    # browser will never need to be told to re-check a URL whose content actually changed.
    location /assets/ {
        include /etc/nginx/bldcms/security_headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html itself must NOT be cached the same way - it's the one file whose content can
    # change (new asset hashes) without its own URL changing, on every new Dashboard build.
    location = /index.html {
        include /etc/nginx/bldcms/security_headers.conf;
        add_header Cache-Control "no-cache";
    }

    # --- API reverse proxy ---
    # One regex covering every backend router prefix (see backend/app/api/*.py) - listed
    # explicitly rather than proxying everything under /, so this config can never accidentally
    # shadow a Dashboard client-side route that happens to share a path segment with an API
    # prefix. Matches both "/checksheet" and "/checksheet/..." forms, since FastAPI/Starlette
    # treats a bare prefix and a trailing-slash prefix as distinct routes in places.
    location ~ ^/(auth|sections|locomotives|equipment|section-equipment-map|templates|template-fields|checksheet|users|settings|notifications|system-health|search|activity-logs|otp-logs|mobile-auth)(/|$) {
        include /etc/nginx/bldcms/security_headers.conf;

        # Module 46.1: a hard refresh (or direct URL entry) on a Dashboard client-side route that
        # shares a path segment with a backend router prefix - /users, /templates, /settings,
        # /system-health, /otp-logs, etc. - matches this same regex. Without this check that
        # request got proxied straight to Gunicorn as a plain unauthenticated GET (a browser
        # navigation never attaches the Bearer token the SPA holds in memory), which 401'd with a
        # raw JSON body instead of ever giving React Router a chance to load and redirect to
        # /login. Real API calls (axios) never send "Accept: text/html"; only top-level browser
        # navigations do - so that header reliably tells the two apart.
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # Never cache API responses - every one of these routes is dynamic/authenticated data.
        add_header Cache-Control "no-store" always;
    }

    # FastAPI's interactive API docs - left reachable through Nginx for operational
    # troubleshooting; remove this block if the API docs should not be publicly reachable.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # --- SPA routing ---
    # Everything else falls through to index.html so React Router can handle client-side routes
    # (e.g. a hard refresh on /checksheets/42 must not 404 - try_files checks for a real file
    # first, then a directory, then falls back to the SPA shell).
    location / {
        include /etc/nginx/bldcms/security_headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
