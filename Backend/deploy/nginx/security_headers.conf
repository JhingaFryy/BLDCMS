# Module 45: shared security headers, `include`-d into every location block below.
#
# Nginx's add_header inheritance rule: a location block only inherits its parent's add_header
# directives if it defines ZERO add_header directives of its own - the moment a location adds
# even one (e.g. a Cache-Control override), every server-level add_header silently stops
# applying to that location. Defining the headers once here and `include`-ing this file in every
# location that also sets its own Cache-Control avoids relying on inheritance at all, so this
# can't regress the next time someone adds a Cache-Control line to a location block.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
